<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM Ecommerce Store – Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .form-card { background: #111; border: 1px solid #333; border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; position: relative; z-index: 1; }
    input[type="password"] {
      background: #000; border: 1px solid #333; color: #fff; border-radius: 12px; padding: 12px 16px;
      width: 100%; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #fff; }
    .btn-white {
      background: #fff; color: #000; border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700;
      font-size: 14px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: background 0.15s, transform 0.1s;
    }
    .btn-white:hover { background: #e5e5e5; }
    .btn-white:disabled { background: #555; color: #999; cursor: not-allowed; }
    label.field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #555; display: block; margin-bottom: 6px; }
    .msg-box { background: #1a0000; border: 1px solid #400; color: #f88; border-radius: 12px; padding: 10px 16px; font-size: 13px; text-align: center; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

  <div class="form-card">
    <div style="text-align:center; margin-bottom: 28px;">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; background:#111; border:1px solid #333; border-radius:14px; font-size:20px; color:#fff; margin-bottom:16px;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 style="font-size:24px; font-weight:800; color:#fff; margin:0;">Reset Password</h1>
      <p style="color:#555; margin-top:8px; font-size:13px;">Enter your new password below.</p>
    </div>

    <div id="msgBox" class="msg-box"></div>

    <form id="resetForm" onsubmit="handleReset(event)" style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label class="field-label">New Password</label>
        <input type="password" id="newPassword" required placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="btn-white" style="margin-top:8px;">
        <i class="fa-solid fa-check"></i> <span id="btnText">Update Password</span>
      </button>
    </form>

    <div style="text-align:center; margin-top:24px;">
      <a href="/index.html" style="color:#555; font-size:13px; text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#555'">
        <i class="fa-solid fa-arrow-left"></i> Back to Login
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      showMessage('Invalid or missing reset token.', false);
      document.getElementById('resetForm').style.display = 'none';
    }

    function showMessage(msg, isSuccess) {
      const el = document.getElementById('msgBox');
      el.innerHTML = msg;
      if (isSuccess) {
        el.style.background = '#0a2a1a';
        el.style.borderColor = '#0f4f2f';
        el.style.color = '#8fdfaf';
      } else {
        el.style.background = '#1a0000';
        el.style.borderColor = '#400';
        el.style.color = '#f88';
      }
      el.style.display = 'block';
    }

    async function handleReset(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const btn = document.getElementById('submitBtn');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (data.success) {
          showMessage(`${data.message}<br><br><a href="/index.html" style="color:#fff; text-decoration:underline;">Click here to log in</a>`, true);
          document.getElementById('resetForm').style.display = 'none';
        } else {
          showMessage(data.error || 'Failed to reset password.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Update Password</span>';
        }
      } catch (err) {
        showMessage('Server error: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Update Password</span>';
      }
    }
  </script>
</body>
</html>
